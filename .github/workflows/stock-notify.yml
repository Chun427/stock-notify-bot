name: Stock Notify
on:
  workflow_dispatch:
    inputs:
      market:
        description: "tw / us"
        default: "tw"
      type:
        description: "open / mid / close"
        default: "open"
  repository_dispatch:
    types: [tw_open, tw_mid, tw_close, us_open, us_mid, us_close]
  schedule:
    - cron: "2 1 * * 1-5"
    - cron: "27 3 * * 1-5"
    - cron: "32 5 * * 1-5"
    - cron: "32 13 * * 1-5"
    - cron: "32 14 * * 1-5"
    - cron: "57 15 * * 1-5"
    - cron: "57 16 * * 1-5"
    - cron: "2 20 * * 1-5"
    - cron: "2 21 * * 1-5"
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TRIGGER: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          CRON: ${{ github.event.schedule }}
          MARKET: ${{ github.event.inputs.market }}
          TYPE: ${{ github.event.inputs.type }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_ID: ${{ secrets.LINE_ID }}
