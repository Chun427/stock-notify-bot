name: Stock Notify

on:
  workflow_dispatch:
    inputs:
      market:
        description: "市場 tw / us"
        required: true
        default: "tw"
        type: choice
        options: ["tw", "us"]
      type:
        description: "時段 open / mid / close"
        required: true
        default: "open"
        type: choice
        options: ["open", "mid", "close"]
  schedule:
    - cron: "2 1 * * 1-5"
    - cron: "27 3 * * 1-5"
    - cron: "32 5 * * 1-5"
    - cron: "32 13 * * 1-5"
    - cron: "32 14 * * 1-5"
    - cron: "57 15 * * 1-5"
    - cron: "57 16 * * 1-5"
    - cron: "2 20 * * 1-5"
    - cron: "2 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run notify
        env:
          TRIGGER: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          MARKET: ${{ github.event.inputs.market }}
          TYPE: ${{ github.event.inputs.type }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets
