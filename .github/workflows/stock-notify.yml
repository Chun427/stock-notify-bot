name: Stock Notify
# 觸發：repository_dispatch = 唯一正式入口（外部 GAS 準時觸發）
# schedule 已停用（避免與 GAS 重複推播）；9 條 cron 見 config.SCHEDULE_CRON_MAP，
# 需臨時恢復 GitHub cron 備援時，貼回 schedule: 區塊即可。
on:
  workflow_dispatch:
    inputs:
      market:
        description: "tw / us"
        default: "tw"
      type:
        description: "open / mid / close"
        default: "open"
  repository_dispatch:
    types: [tw_open, tw_mid, tw_close, us_open, us_mid, us_close]
concurrency:
  group: stock-notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TRIGGER: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          CRON: ${{ github.event.schedule }}
          MARKET: ${{ github.event.inputs.market }}
          TYPE: ${{ github.event.inputs.type }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_ID: ${{ secrets.LINE_ID }}
